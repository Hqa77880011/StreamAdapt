[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "streamadapt"
version = "0.1.0"
description = "Evidence-gated streaming video adaptation implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.2", "opencv-python-headless>=4.8", "scikit-learn>=1.3", "matplotlib>=3.7"]
[project.scripts]
streamadapt = "streamadapt.cli:main"
[tool.setuptools.packages.find]
include = ["streamadapt*"]
